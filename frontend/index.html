<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAWASSA-MESOB</title>
    <meta name="description" content="MESOB Center provides official information about organizations and services, including required documents, service fees, and processing time. Be informed before visiting MESOB Center." />
    <link rel="icon" type="image/png" href="https://mesobcenter.et/files/logo.png" />
    <link rel="canonical" href="https://mesobcenter.et/" />

    <!-- Open Graph -->
    <meta property="og:title" content="HAWASSA-MESOB" />
    <meta property="og:description" content="Find organizations, services, required documents, fees, and processing time at MESOB Center before visiting." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mesobcenter.et/" />
    <meta property="og:image" content="https://mesobcenter.et/files/Mesob.jpeg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome for icons used in popular services -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Apply saved theme before paint (prevents flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else if (t === 'light') document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
